done:
  - OpenAI Responses API is now the main tutor/course/grader provider path; OpenRouter path was removed from active routing
  - direct AI file edits and generated code exercises reuse or rename the active IDE whiteboard file instead of creating folders/README/new JS files
  - setup flow now asks subject, asks readiness, runs adaptive assessment, shows review, then generates course from assessment
  - assessment MCQs require plausible same-length distractors and adaptive follow-up after skipped/wrong prerequisite answers
  - assessment follow-ups now step down after skipped/wrong prerequisite answers and check readiness signals such as syntax recognition, input/rule/output tracing, debugging mindset, and prerequisite gaps
  - assessment MCQs now ask with explicit intent to discover learner intention, readiness, prerequisite gaps, syntax bridges, and required modules; the skip control is learner-facing as I don't know
  - assessment question generation now has a server-side stabilizer that replaces repeated/skipped-prerequisite loops with bridge/course-shaping questions
  - assessment and generated-course MCQs now rotate/normalize correct-option positions so answers do not default to A/B
  - assessment MCQs can also ask course-shaping language/library/tool preference questions; those are not graded right/wrong
  - course-content/v2 modules/topics/blocks/steps implemented with v1 compatibility
  - generated block kinds are explicit: theory, quiz, workshop, lab, project, review
  - theory blocks use slow intro, consistent analogy, example, summary, and optional single-MCQ checks
  - course generation prompts now allow flexible theory structure instead of forcing concept -> analogy -> example every topic
  - generated content normalization enforces block-kind step boundaries, so theory/quiz/workshop/lab blocks cannot silently mix incompatible step types
  - quiz blocks are exam-style MCQ-only checkpoints with multiple questions; one-off MCQ checks stay inside theory blocks
  - workshop blocks are guided practical editor steps that build on each other
  - lab blocks are independent practice, usually one step, only after workshop or thorough teaching
  - answer-in-chat/reflection prompts require recap or clue before asking the learner to write
  - generated course prompt no longer asks for user level, learning mode, project type, Leetcode preference, preview edits, or final confirmation
  - left panel now has Modules and Files tabs; generated courses default to Modules
  - module list is compact title-only buttons; module detail renders chapter/topic, block, and compact numbered step tiles
  - course tree step tiles now navigate the right-panel lesson conversation; locked module shell buttons are disabled
  - course tree now auto-expands and highlights the active module, topic/block, and current step as the learner progresses
  - generated courses now fully load/unlock modules 1 and 2, while modules 3+ remain locked shell buttons
  - course lesson progress bar now tracks steps inside the current block, with Next section/block/topic labels and no auto-advance across modules
  - workshop/lab/project steps now include context and MVP acceptance checklists; editor submissions update a dynamic checklist
  - workshop prompts now require FreeCodeCamp-style tutorial guidance before learner action, including many tiny numbered steps, syntax reminders/examples, exact step code, and explanation of important lines
  - course generation now assumes zero programming/syntax knowledge unless assessment proves otherwise, and prompts must explain every new code token before requiring it
  - generated workshops are variable-length guided mini-projects; two-step workshops are rejected during normalization instead of rendered as real workshops
  - labs should usually reuse the same project pattern as the preceding workshop with a variant and less guidance
  - lesson rendering now strips leaked prompt/internal-planning text and replaces old generic fallback workshop context with language-aware context
  - Java/Python/C++/JS workshop lessons now render syntax reminders and starter-code explanations from the actual starter code
  - C# course/exercise detection now correctly resolves C# instead of C, including saved-course display repair for older C# lessons that stored C/printf metadata
  - course workshop starter files auto-load once per step; the manual Load starter button was removed and the primary editor action is Check -> Submit and next after pass
  - generated code exercise grading now evaluates generated acceptance criteria on both client checklist and server progression API instead of passing on generic code shape alone
  - generated visual exercises can set requiresPreview so the lesson tells learners to inspect the Visual view before submitting
  - generated exercise normalization replaces obvious JavaScript starter code when the target exercise language is non-JS
  - editor exercise MVP checklist can be collapsed/restored from the lesson chat dock
  - shared editor language registry maps common languages to CodeMirror support, generated filenames, run capability, and preview support
  - CodeMirror support now includes Go, Rust, C#, Ruby, Swift, shell, YAML, XML, Vue/Svelte-like markup, and prior JS/TS/Python/HTML/CSS/SQL/Java/C++/PHP modes
  - editor has a frosted Code/Visual toggle; visual preview supports HTML, CSS, and browser JavaScript
  - Files tab keeps existing file/folder tree and file/folder actions live in per-item triple-dot menus
  - right-panel Course Roadmap button/function was removed
  - completed generated MCQ/writing/editor steps hydrate from progression attempts when revisited
  - AI chat and editor text were brightened/enlarged while preserving code line-number gutter brightness
  - generated topic transitions avoid repeating the first Stonecode greeting after the first course step
  - tutor lesson rendering introduces as a personal AI Tutor, not as Stonecode

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Stonecode minimalist logo study</title>
  <desc id="desc">Three flat black, white, and green logo directions inspired by marks already used in the Stonecode app.</desc>
  <rect width="1600" height="1080" fill="#050505"/>
  <text x="72" y="72" fill="#F4F5EF" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" letter-spacing="2">STONECODE / LOGO STUDY 02</text>
  <text x="1528" y="72" fill="#6D716C" text-anchor="end" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="1">FLAT · MONO · #65B960</text>

  <g transform="translate(72 116)">
